{% extends "base.html" %}
{% block content %}

<div class="card-box p-4">
    <div class="section-title">공지사항</div>
    <div class="table-responsive">
        <table class="table">
            <thead>
                <tr>
                    <th style="width:140px;">분류</th>
                    <th>제목</th>
                    <th style="width:140px;">작성일</th>
                </tr>
            </thead>
            <tbody>
                {% for r in rows %}
                <tr>
                    <td>
                        {% if r.is_pinned %}
                        <span class="badge text-bg-danger">중요</span>
                        {% else %}
                        <span class="badge text-bg-light">{{ r.category }}</span>
                        {% endif %}
                    </td>
                    <td><a href="{{ url_for('notice_detail', nid=r.id) }}">{{ r.title }}</a></td>
                    <td>{{ r.created_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}
