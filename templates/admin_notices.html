{% extends "base.html" %}
{% block content %}

<div class="row g-4">
    <div class="col-lg-4">
        <div class="card-box p-4">
            <div class="section-title">공지 등록</div>
            <form method="post" class="row g-3">
                <input type="hidden" name="action" value="create">

                <div class="col-12">
                    <label class="form-label">제목</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <div class="col-12">
                    <label class="form-label">분류</label>
                    <input type="text" name="category" class="form-control" placeholder="공지사항 / 시설안내 / 프로그램">
                </div>

                <div class="col-12">
                    <label class="form-label">내용</label>
                    <textarea name="content" rows="7" class="form-control" required></textarea>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_pinned" id="is_pinned">
                        <label class="form-check-label" for="is_pinned">중요 공지로 상단 고정</label>
                    </div>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary w-100">공지 등록</button>
                </div>
            </form>
        </div>
    </div>

    <div class="col-lg-8">
        {% for n in notices %}
        <div class="card-box p-4 mb-3">
            <div class="row g-3">
                <div class="col-12">
                    <form method="post" class="row g-3">
                        <input type="hidden" name="action" value="update">
                        <input type="hidden" name="notice_id" value="{{ n.id }}">

                        <div class="col-md-8">
                            <label class="form-label">제목</label>
                            <input type="text" name="title" class="form-control" value="{{ n.title }}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">분류</label>
                            <input type="text" name="category" class="form-control" value="{{ n.category }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label">내용</label>
                            <textarea name="content" rows="5" class="form-control" required>{{ n.content }}</textarea>
                        </div>

                        <div class="col-md-6 d-flex align-items-end">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="is_pinned" id="pin{{ n.id }}" {% if n.is_pinned %}checked{% endif %}>
                                <label class="form-check-label" for="pin{{ n.id }}">중요 공지</label>
                            </div>
                        </div>

                        <div class="col-md-6 text-md-end">
                            <span class="small-muted">작성일 {{ n.created_at }}</span>
                        </div>

                        <div class="col-12 d-flex gap-2">
                            <button class="btn btn-primary">수정 저장</button>
                    </form>

                            <form method="post" onsubmit="return confirm('이 공지를 삭제할까요?');">
                                <input type="hidden" name="action" value="delete">
                                <input type="hidden" name="notice_id" value="{{ n.id }}">
                                <button class="btn btn-outline-danger">삭제</button>
                            </form>
                        </div>
                </div>
            </div>
        </div>
        {% else %}
        <div class="card-box p-4 text-center text-muted">등록된 공지가 없습니다.</div>
        {% endfor %}
    </div>
</div>

{% endblock %}
